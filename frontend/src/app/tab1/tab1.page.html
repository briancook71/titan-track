<ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Titan Track Programs</ion-title>
    </ion-toolbar>
  </ion-header>
<br>

<ion-content [fullscreen]="true">

  <ion-content color="light">
  
    <ion-list [inset]="true">
  <ion-item>
    <ion-textarea label="Pull Movements" labelPlacement="floating" placeholder="Enter text"></ion-textarea>
  </ion-item> 

    
     
    <ion-item>
      <ion-label>Back</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Biceps</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Hamstrings</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Trapezius</ion-label>
    </ion-item>
  </ion-list>

    <ion-list [inset]="true">
    <ion-item>
    <ion-textarea label="Push Movements" labelPlacement="floating" placeholder="Enter text"></ion-textarea>
  </ion-item> 
      <ion-item>
      <ion-label>Chest</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Shoulders</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Triceps</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Quadraceps</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Calves</ion-label>
    </ion-item>
  </ion-list>

 <ion-list [inset]="true">
      <ion-item>
    <ion-textarea label="Warm Up" labelPlacement="floating" placeholder="Enter text"></ion-textarea>
  </ion-item> 
    <ion-item>
      <ion-label>Walk</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Bike</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Row</ion-label>
    </ion-item>
    
  </ion-list>

</ion-content>
  



    <div *ngFor="let program_item of programs()"> 
      <div>{{program_item.title}}</div>
    </div>

 

</ion-content>
